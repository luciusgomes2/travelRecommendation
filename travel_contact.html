<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TravelBloom</title>
  <link rel="stylesheet" href="./travel_recommendation.css">
</head>
<body>
   <nav><h1>TravelBloom</h1>
<ul>
  <li><a href="./travel_recommendation.html" id="home">Home</a></li>
  <li><a href="./travel_aboutUs.html" id="about">About Us</a></li>
  <li><a href="./travel_contact.html" id="contact">Contact Us</a></li>
  <li class="search-box">
    <input
        type="text"
        id="searchBar"
        placeholder="Enter a destination or keyword">
    <button id="btnSearch">Search</button>
    <button id="btnResetSearch">Clear</button>
</li>

</ul>
</nav>
<main class="contact">
    <!-- Redes Sociais na Esquerda -->
 
    <aside class="social-sidebar">
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-facebook-f"></i></a>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-youtube"></i></a>
      </aside>

        <!-- Texto da página -->
        <div class="contact-text">

            <h1>CONTACT US</h1>

            <p>Get in touch</p>

        </div>

        <div class="contact-form">

            <form>

                <label>Name</label>

                <input type="text" placeholder="Enter your name">

                <label>Email</label>

                <input type="email" placeholder="Enter your email">

                <label>Message</label>

                <textarea placeholder="Enter your message"></textarea>

                <button>Submit</button>

            </form>

        </div>

    </section>

</main>
<script src="./travel_recommendation.js"></script>
</body>
</html>
